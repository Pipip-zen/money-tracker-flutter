name: money_tracker
description: "Aplikasi pencatat keuangan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^1.2.0
  get_it: ^8.0.0
  uuid: ^4.4.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  pdf: ^3.12.0
  csv: ^8.0.0
  font_awesome_flutter: ^10.7.0
  table_calendar: ^3.1.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
